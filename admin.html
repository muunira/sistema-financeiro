<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários(as) - TI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="shortcut icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
</head>
<body class="page-dashboard">

    <header class="header header-dashboard">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <img src="img/logo.png" alt="Logo">
                </div>
                <div>
                    <h1>Gerenciar Usuários(as)</h1>
                    <span class="subtitle">Painel do(a) Diretor(a) de TI</span>
                </div>
            </div>
            <nav class="header-nav" id="headerNav"></nav>
        </div>
    </header>

    <main style="max-width:1100px; margin:2rem auto; padding:0 2rem;">

        <div class="alert alert-warning" id="alertaRestrito" style="display:none; margin-bottom:1.5rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Esta página é exclusiva para o(a) Diretor(a) de TI.</span>
        </div>

        <div id="conteudoAdmin">

            <div class="admin-card">
                <div class="admin-card-header">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Adicionar Novo(a) Usuário(a)
                    </h2>
                </div>
                <div class="admin-card-body">

                    <div class="alert alert-error" id="alertaErroCadastro" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <span id="msgErroCadastro"></span>
                    </div>

                    <div class="alert alert-success" id="alertaSucessoCadastro" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                        <span id="msgSucessoCadastro"></span>
                    </div>

                    <form id="formNovoUsuario" class="form-admin">
                        <div class="form-admin-grid">
                            <div class="form-group">
                                <label for="novoNome">Nome Completo</label>
                                <input type="text" id="novoNome" placeholder="Ex: João Silva" required>
                            </div>
                            <div class="form-group">
                                <label for="novoUsuario">Usuário(a) (login)</label>
                                <input type="text" id="novoUsuario" placeholder="Ex: joao.silva" required>
                            </div>
                            <div class="form-group">
                                <label for="novaSenha">Senha</label>
                                <div class="input-senha-wrapper">
                                    <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres" required>
                                    <button type="button" class="toggle-senha" onclick="toggleSenhaCadastro()">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                            <circle cx="12" cy="12" r="3"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="novoCargo">Cargo / Função</label>
                                <input type="text" id="novoCargo" placeholder="Ex: Analista de Suporte">
                            </div>
                            <div class="form-group">
                                <label for="novoPerfil">Perfil de Acesso</label>
                                <select id="novoPerfil">
                                    <option value="tecnico">Técnico(a)</option>
                                    <option value="analista">Analista</option>
                                    <option value="coordenador">Coordenador(a)</option>
                                    <option value="estagiario">Estagiário(a)</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit btn-submit-admin">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                                <circle cx="8.5" cy="7" r="4"/>
                                <line x1="20" y1="8" x2="20" y2="14"/>
                                <line x1="23" y1="11" x2="17" y2="11"/>
                            </svg>
                            Criar Usuário(a)
                        </button>
                    </form>
                </div>
            </div>

            <div class="admin-card" style="margin-top:1.5rem;">
                <div class="admin-card-header">
                    <h2>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        Usuários(as) com Acesso ao Dashboard
                    </h2>
                    <span class="badge-count" id="totalUsuarios">0</span>
                </div>
                <div class="admin-card-body">
                    <div class="usuarios-grid" id="listaUsuarios"></div>
                </div>
            </div>
        </div>
                    <!-- Modal Editar Usuário(a) -->
        <div class="modal-overlay" id="modalEditarUsuario">
            <div class="modal modal-editar-usuario">
                <button class="modal-close" onclick="fecharModalEditar()">✕</button>

                <div class="modal-icon" style="background:var(--primary-light); color:var(--primary);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </div>

                <h3>Editar Usuário(a)</h3>

                <div class="alert alert-error" id="alertaErroEdicao" style="display:none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="msgErroEdicao"></span>
                </div>

                <form id="formEditarUsuario" class="form-editar-usuario">
                    <input type="hidden" id="editarId">

                    <div class="form-group">
                        <label for="editarNome">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Nome Completo
                        </label>
                        <input type="text" id="editarNome" placeholder="Nome completo" required>
                    </div>

                    <div class="form-group">
                        <label for="editarLogin">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            Usuário(a) (login)
                        </label>
                        <input type="text" id="editarLogin" placeholder="Login de acesso" required>
                    </div>

                    <div class="form-group">
                        <label for="editarCargoUsuario">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                            </svg>
                            Cargo / Função
                        </label>
                        <input type="text" id="editarCargoUsuario" placeholder="Cargo ou função">
                    </div>

                    <div class="modal-editar-btns">
                        <button type="button" class="btn-modal btn-cancelar" onclick="fecharModalEditar()">
                            Cancelar
                        </button>
                        <button type="submit" class="btn-modal btn-salvar-edicao">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                <polyline points="17 21 17 13 7 13 7 21"/>
                                <polyline points="7 3 7 8 15 8"/>
                            </svg>
                            Salvar Alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modalEditarSenha">
        <div class="modal modal-sm">
            <button class="modal-close" onclick="fecharModalSenha()">✕</button>
            <div class="modal-icon" style="background:var(--primary-light); color:var(--primary);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h3>Redefinir Senha</h3>
            <p style="margin-bottom:1rem; color:var(--text-light);">
                Usuário(a): <strong id="editarUsuarioNome"></strong>
            </p>
            <div class="form-group">
                <label>Nova Senha</label>
                <input type="password" id="novaSenhaEdicao" placeholder="Mínimo 6 caracteres">
            </div>
            <div style="display:flex; gap:8px; margin-top:1rem;">
                <button class="btn-modal btn-cancelar" onclick="fecharModalSenha()">Cancelar</button>
                <button class="btn-modal" onclick="salvarNovaSenha()">Salvar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalConfirmacaoStatus">
        <div class="modal modal-confirmacao">
            <div class="modal-confirmacao-icone">?</div>
            <h3 class="modal-confirmacao-titulo">Confirmar</h3>
            <p class="modal-confirmacao-mensagem"></p>
            <p class="modal-confirmacao-sub"></p>
            <div class="modal-confirmacao-btns">
                <button class="btn-modal btn-cancelar-status" onclick="fecharModalConfirmacaoAdmin()">
                    Cancelar
                </button>
                <button class="btn-modal btn-confirmar-status" id="btnConfirmarAdmin">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/notificacoes.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
