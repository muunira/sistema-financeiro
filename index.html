<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Chamado - Suporte TI - Porto Velho</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="shortcut icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
</head>
<body class="page-chamado">

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <img src="img/logo.png" alt="Logo">
                </div>
                <div>
                    <h1>Suporte TI - Porto Velho</h1>
                    <span class="subtitle">Central de Chamados</span>
                </div>
            </div>
            <nav>
                <a href="dashboard.html" class="btn-nav">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"/>
                        <rect x="14" y="3" width="7" height="7"/>
                        <rect x="3" y="14" width="7" height="7"/>
                        <rect x="14" y="14" width="7" height="7"/>
                    </svg>
                    Dashboard TI
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="form-container">
            <div class="form-header">
                <h2>Abrir Novo Chamado</h2>
                <p>Preencha as informações abaixo para registrar sua solicitação ao setor de TI.</p>
            </div>

            <form id="formChamado" class="form-chamado">
                <!-- Nome -->
                <div class="form-group">
                    <label for="nome">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        Nome Completo
                    </label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>

                <!-- Setor -->
                <div class="form-group">
                    <label for="setor">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Setor
                    </label>
                    <select id="setor" name="setor" required>
                        <option value="">Selecione seu setor</option>
                        <option value="Diretoria">Diretoria</option>
                        <option value="Financeiro">Financeiro</option>
                        <option value="Recursos Humanos">Recursos Humanos</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Departamento Pessoal">Departamento Pessoal</option>
                        <option value="Vendas">Vendas</option>
                        <option value="Compras">Compras</option>
                        <option value="Assistência Técnica">Assistência Ténica</option>
                        <option value="LAIMO">LAIMO</option>
                        <option value="Depósito">Depósito</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <!-- Tipo de Problema -->
                <div class="form-group">
                    <label for="problema">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        Tipo de Problema
                    </label>
                    <select id="problema" name="problema" required>
                        <option value="">Selecione o tipo de problema</option>
                        <option value="Computador não liga">Computador não liga</option>
                        <option value="Internet/Rede">Internet / Rede</option>
                        <option value="Impressora">Impressora</option>
                        <option value="E-mail">E-mail</option>
                        <option value="Acesso/Permissão">Acesso / Permissão</option>
                        <option value="Mouse/Teclado">Mouse / Teclado</option>
                        <option value="Telefone">Telefone</option>
                        <option value="Dados">Dados</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <!-- Prioridade -->
                <div class="form-group">
                    <label for="prioridade">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
                            <line x1="4" y1="22" x2="4" y2="15"/>
                        </svg>
                        Prioridade
                    </label>
                    <div class="prioridade-options">
                        <input type="radio" id="baixa" name="prioridade" value="Baixa" required>
                        <label for="baixa" class="prioridade-label baixa">
                            <span class="dot"></span>
                            Baixa
                        </label>

                        <input type="radio" id="media" name="prioridade" value="Média">
                        <label for="media" class="prioridade-label media">
                            <span class="dot"></span>
                            Média
                        </label>

                        <input type="radio" id="alta" name="prioridade" value="Alta">
                        <label for="alta" class="prioridade-label alta">
                            <span class="dot"></span>
                            Alta
                        </label>

                        <input type="radio" id="critica" name="prioridade" value="Crítica">
                        <label for="critica" class="prioridade-label critica">
                            <span class="dot"></span>
                            Crítica
                        </label>
                    </div>
                </div>

                <!-- Descrição -->
                <div class="form-group">
                    <label for="descricao">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        Descrição Detalhada
                    </label>
                    <textarea id="descricao" name="descricao" rows="5" placeholder="Descreva o problema com o máximo de detalhes possível..." required></textarea>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn-submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Enviar Chamado
                </button>
            </form>
        </div>

        <!-- Meus Chamados -->
        <div class="meus-chamados-container" id="meusChamadosContainer" style="display:none;">
            <h3>📋 Seus Chamados Recentes</h3>
            <div id="listaMeusChamados"></div>
        </div>
    </main>

    <!-- Modal de Sucesso -->
    <div class="modal-overlay" id="modalSucesso">
        <div class="modal">
            <div class="modal-icon sucesso">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <h3>Chamado Registrado!</h3>
            <p>Seu chamado <strong id="numeroChamado"></strong> foi aberto com sucesso.</p>
            <p class="modal-sub">A equipe de TI irá atendê-lo conforme a prioridade.</p>
            <button class="btn-modal" onclick="fecharModal()">Entendido</button>
        </div>
    </div>

    <script src="js/notificacoes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
