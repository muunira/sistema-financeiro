<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de Compras</title>
  <meta name="description" content="Sistema de controle de estoque e compras por papel." />
  <meta property="og:title" content="Sistema de Estoque & Compras" />
  <meta property="og:description" content="Controle de estoque, compras e pagamentos da empresa." />
  <meta property="og:image" content="https://www.portovelhocompras.online/assets/financeiro.png" />
  <meta property="og:url" content="https://www.portovelhocompras.online" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://www.portovelhocompras.online/assets/financeiro.png" />
  <link rel="icon" type="image/png" href="assets/financeiro.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <script>try{if(localStorage.getItem('tema')==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">
  <button id="theme-btn-login" class="theme-fab" type="button"></button>
  <div class="login-card">
    <img class="login-logo" src="assets/financeiro.png" alt="Logo" />
    <h1>Controle de Estoque &amp; Compras</h1>
    <p class="login-sub">Acesso restrito. Entre com suas credenciais.</p>

    <form id="login-form">
      <label>
        E-mail
        <input type="email" id="email" required autocomplete="username" />
      </label>
      <label>
        Senha
        <input type="password" id="password" required autocomplete="current-password" />
      </label>
      <button type="submit" id="submit-btn" class="btn btn-ok login-btn">Entrar</button>
      <p id="error-msg" class="error hidden"></p>
    </form>

    <p id="config-warning" class="warning hidden">
      Supabase não configurado. Edite <code>js/supabase.js</code> com sua URL e anon key.
    </p>
  </div>

  <script type="module">
    import { login, getSession, isConfigured } from "./js/auth.js";
    import { bindThemeButton } from "./js/theme.js";

    bindThemeButton(document.getElementById("theme-btn-login"), false);

    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const submitBtn = document.getElementById("submit-btn");

    if (!isConfigured()) {
      document.getElementById("config-warning").classList.remove("hidden");
    }

    if (new URLSearchParams(location.search).get("erro") === "inativo") {
      errorMsg.textContent = "Sua conta está inativa ou não foi encontrada. Contate o administrador.";
      errorMsg.classList.remove("hidden");
    }

    // Se já estiver logado, vai direto pro app
    getSession().then((s) => { if (s) window.location.href = "app.html"; });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Entrando...";
      try {
        await login(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        window.location.href = "app.html";
      } catch (err) {
        errorMsg.textContent = "E-mail ou senha inválidos.";
        errorMsg.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
