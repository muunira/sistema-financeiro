<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Chamados - Suporte TI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="shortcut icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <meta property="og:title" content="Meus Chamados - Suporte TI">
    <meta property="og:description" content="Central de Chamados - Suporte TI Porto Velho">
    <meta property="og:image" content="https://chamadosportovelho.vercel.app/img/logo.png">
    <meta property="og:type" content="website">
</head>
<body class="page-dashboard">

    <header class="header header-dashboard">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <img src="img/logo.png" alt="Logo">
                </div>
                <div>
                    <h1>Meus Chamados</h1>
                    <span class="subtitle">Acompanhe suas solicitações</span>
                </div>
            </div>
            <nav class="header-nav" id="headerNav"></nav>
        </div>
    </header>

    <main style="max-width:900px; margin:2rem auto; padding:0 1.5rem;">

        <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom:1.5rem;">
            <div class="stat-card abertos">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="meusAbertos">0</span>
                    <span class="stat-label">Abertos</span>
                </div>
            </div>
            <div class="stat-card andamento">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10"/>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="meusAndamento">0</span>
                    <span class="stat-label">Em Andamento</span>
                </div>
            </div>
            <div class="stat-card resolvidos">
                <div class="stat-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>
                <div class="stat-info">
                    <span class="stat-number" id="meusResolvidos">0</span>
                    <span class="stat-label">Resolvidos</span>
                </div>
            </div>
        </div>

        <div class="admin-card">
            <div class="admin-card-header">
                <h2>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    Seus Chamados
                </h2>
                <a href="index.html" class="btn-submit" style="width:auto; padding:8px 18px; font-size:0.85rem; margin:0;">
                    + Novo Chamado
                </a>
            </div>
            <div class="admin-card-body" id="listaChamados">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                        <polyline points="13 2 13 9 20 9"/>
                    </svg>
                    <h3>Nenhum chamado ainda</h3>
                    <p>Clique em "Novo Chamado" para abrir sua primeira solicitação.</p>
                </div>
            </div>
        </div>

    </main>

    <div class="modal-overlay" id="modalDetalhes">
        <div class="modal modal-detalhes">
            <button class="modal-close" onclick="fecharModal()">&#10005;</button>
            <h3>Detalhes do Chamado <span id="detalheNumero"></span></h3>
            <div class="detalhe-grid">
                <div class="detalhe-item">
                    <strong>Problema:</strong>
                    <span id="detalheProblema"></span>
                </div>
                <div class="detalhe-item">
                    <strong>Prioridade:</strong>
                    <span id="detalhePrioridade"></span>
                </div>
                <div class="detalhe-item">
                    <strong>Setor:</strong>
                    <span id="detalheSetor"></span>
                </div>
                <div class="detalhe-item">
                    <strong>Status:</strong>
                    <span id="detalheStatus"></span>
                </div>
                <div class="detalhe-item">
                    <strong>Data:</strong>
                    <span id="detalheData"></span>
                </div>
                <div class="detalhe-item full">
                    <strong>Descrição:</strong>
                    <p id="detalheDescricao"></p>
                </div>
                <div class="detalhe-item full" id="feedbackSection" style="display:none;">
                    <strong>Feedback da Equipe TI:</strong>
                    <p id="detalheFeedback" style="background:#ecfdf5; border:1px solid #6ee7b7;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let meusChamados = [];

        document.addEventListener('DOMContentLoaded', () => {
            const sessao = Auth.verificarSessao();
            if (!sessao) { window.location.href = 'login.html'; return; }

            renderizarHeader(sessao);
            carregarMeusChamados(sessao.id);

            setInterval(() => carregarMeusChamados(sessao.id), 5000);
        });

        function renderizarHeader(sessao) {
            const nav = document.getElementById('headerNav');
            if (!nav) return;
            const iniciais = sessao.nome.split(' ').filter(p => p).slice(0, 2).map(p => p[0].toUpperCase()).join('');

            nav.innerHTML = `
                <a href="index.html" class="btn-nav">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Novo Chamado
                </a>
                <div class="user-menu-wrapper" id="userMenuWrapper">
                    <button class="user-menu-btn" id="userMenuBtn" onclick="toggleMenu()">
                        <div class="user-menu-avatar">${iniciais}</div>
                        <span class="user-menu-nome">${sessao.nome}</span>
                        <svg class="user-menu-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-perfil">
                            <div class="dropdown-perfil-topo">
                                <div class="dropdown-avatar-lg">${iniciais}</div>
                                <div class="dropdown-perfil-info">
                                    <div class="dropdown-perfil-nome">${sessao.nome}</div>
                                    <div class="dropdown-perfil-cargo">Usuário</div>
                                </div>
                            </div>
                            <div class="dropdown-perfil-role">
                                👤 Usuário
                            </div>
                        </div>
                        <div class="dropdown-sessao">
                            <span class="dropdown-sessao-dot"></span>
                            Sessão ativa
                        </div>
                        <div class="dropdown-nav">
                            <a href="perfil.html" class="dropdown-nav-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                                Meu Perfil
                            </a>
                            <a href="index.html" class="dropdown-nav-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                Abrir Novo Chamado
                            </a>
                            <a href="meus-chamados.html" class="dropdown-nav-item">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                </svg>
                                Meus Chamados
                            </a>
                        </div>
                        <div class="dropdown-logout-area">
                            <button class="dropdown-logout-btn" onclick="Auth.logout()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                                    <polyline points="16 17 21 12 16 7"/>
                                    <line x1="21" y1="12" x2="9" y2="12"/>
                                </svg>
                                Sair da Conta
                            </button>
                        </div>
                    </div>
                </div>
            `;

            document.addEventListener('click', (e) => {
                const wrapper = document.getElementById('userMenuWrapper');
                if (wrapper && !wrapper.contains(e.target)) {
                    document.getElementById('userMenuBtn')?.classList.remove('aberto');
                    document.getElementById('userDropdown')?.classList.remove('aberto');
                }
            });
        }

        function toggleMenu() {
            const btn = document.getElementById('userMenuBtn');
            const dropdown = document.getElementById('userDropdown');
            if (!btn || !dropdown) return;
            const aberto = dropdown.classList.contains('aberto');
            btn.classList.toggle('aberto', !aberto);
            dropdown.classList.toggle('aberto', !aberto);
        }

        async function carregarMeusChamados(usuarioId) {
            try {
                const resp = await fetch(`/api/meus-chamados/${usuarioId}`);
                const data = await resp.json();
                if (!data.sucesso) return;

                meusChamados = data.chamados;
                atualizarStats();
                renderizarLista();
            } catch(e) {
                console.error('Erro ao carregar chamados:', e);
            }
        }

        function atualizarStats() {
            document.getElementById('meusAbertos').textContent = meusChamados.filter(c => c.status === 'Aberto').length;
            document.getElementById('meusAndamento').textContent = meusChamados.filter(c => c.status === 'Em Andamento').length;
            document.getElementById('meusResolvidos').textContent = meusChamados.filter(c => c.status === 'Resolvido').length;
        }

        function renderizarLista() {
            const container = document.getElementById('listaChamados');
            const empty = document.getElementById('emptyState');

            if (meusChamados.length === 0) {
                container.innerHTML = '';
                container.appendChild(empty);
                empty.style.display = 'block';
                return;
            }

            container.innerHTML = '';
            meusChamados.forEach(chamado => {
                const statusClass = {'Aberto':'aberto','Em Andamento':'andamento','Resolvido':'resolvido'}[chamado.status] || '';
                const hasFeedback = chamado.feedback && chamado.status === 'Resolvido';

                const div = document.createElement('div');
                div.className = 'meu-chamado-item';
                div.style.cursor = 'pointer';
                div.onclick = () => verDetalhes(chamado);
                div.innerHTML = `
                    <div class="meu-chamado-info">
                        <strong>#${chamado.numero}</strong>
                        <span>${chamado.problema}</span>
                        <span class="badge-status ${statusClass}">${chamado.status}</span>
                        ${hasFeedback ? '<span style="font-size:0.75rem; background:#ecfdf5; color:#047857; padding:2px 8px; border-radius:12px; font-weight:600;">💬 Feedback</span>' : ''}
                    </div>
                    <span style="font-size:0.8rem; color:var(--text-light);">${chamado.data_hora}</span>
                `;
                container.appendChild(div);
            });
        }

        function verDetalhes(chamado) {
            document.getElementById('detalheNumero').textContent = `#${chamado.numero}`;
            document.getElementById('detalheProblema').textContent = chamado.problema;
            document.getElementById('detalhePrioridade').textContent = chamado.prioridade;
            document.getElementById('detalheSetor').textContent = chamado.setor;
            document.getElementById('detalheStatus').innerHTML = `<span class="badge-status ${{'Aberto':'aberto','Em Andamento':'andamento','Resolvido':'resolvido'}[chamado.status] || ''}">${chamado.status}</span>`;
            document.getElementById('detalheData').textContent = chamado.data_hora;
            document.getElementById('detalheDescricao').textContent = chamado.descricao;

            const feedbackSection = document.getElementById('feedbackSection');
            const feedbackEl = document.getElementById('detalheFeedback');
            if (chamado.feedback) {
                feedbackSection.style.display = 'block';
                feedbackEl.textContent = chamado.feedback;
            } else {
                feedbackSection.style.display = 'none';
            }

            document.getElementById('modalDetalhes').classList.add('active');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.remove('active');
        }

        document.getElementById('modalDetalhes')?.addEventListener('click', e => {
            if (e.target.id === 'modalDetalhes') fecharModal();
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
    </script>
</body>
</html>
