<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Compras</title>
  <meta name="description" content="Sistema de controle de estoque e compras por papel." />
  <meta property="og:title" content="Sistema de Estoque & Compras" />
  <meta property="og:description" content="Controle de estoque, compras e pagamentos da empresa." />
  <meta property="og:image" content="https://www.portovelhocompras.online/assets/logo.png" />
  <meta property="og:url" content="https://www.portovelhocompras.online" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://www.portovelhocompras.online/assets/logo.png" />
  <link rel="icon" type="image/png" href="/assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <script>try{if(localStorage.getItem('tema')==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.png" alt="Logo" />
        <span>Estoque &amp; Compras</span>
      </div>
      <nav id="nav-menu"></nav>
      <div class="sidebar-footer">
        <div id="user-info"></div>
        <button id="theme-btn" class="footer-btn"></button>
        <button type="button" id="logout-btn" style="position:relative;z-index:10">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Sair</span>
        </button>
      </div>
    </aside>
    <main class="content">
      <div id="view" class="view"></div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
